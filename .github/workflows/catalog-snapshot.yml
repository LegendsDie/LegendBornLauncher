name: Server catalog snapshot

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/server-catalog-snapshot.mjs"
      - "tests/server-catalog-snapshot.test.mjs"
      - ".github/workflows/catalog-snapshot.yml"
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-catalog-snapshot-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

env:
  CATALOG_SOURCE_URL: https://legendborn.xyz/api/launcher/servers
  SELECTEL_PUBLIC_URL: https://612cd759-4c9d-450e-bc91-a51d3c56e834.selstorage.ru/launcher/servers.json
  SELECTEL_OBJECT_KEY: launcher/servers.json

jobs:
  validate:
    name: Validate snapshot publisher
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Run snapshot contract tests
        run: node --test tests/server-catalog-snapshot.test.mjs

      - name: Syntax-check publisher
        run: node --check scripts/server-catalog-snapshot.mjs

  publish-selectel:
    name: Publish production snapshot to Selectel
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Require Selectel configuration
        shell: bash
        env:
          MIRROR_ENDPOINT: ${{ vars.LEGENDBORN_VPK_MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ vars.LEGENDBORN_VPK_MIRROR_BUCKET }}
          MIRROR_KEY_ID: ${{ secrets.LEGENDBORN_VPK_MIRROR_KEY_ID }}
          MIRROR_SECRET: ${{ secrets.LEGENDBORN_VPK_MIRROR_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MIRROR_ENDPOINT" ]] || missing+=("vars.LEGENDBORN_VPK_MIRROR_ENDPOINT")
          [[ -n "$MIRROR_BUCKET" ]] || missing+=("vars.LEGENDBORN_VPK_MIRROR_BUCKET")
          [[ -n "$MIRROR_KEY_ID" ]] || missing+=("secrets.LEGENDBORN_VPK_MIRROR_KEY_ID")
          [[ -n "$MIRROR_SECRET" ]] || missing+=("secrets.LEGENDBORN_VPK_MIRROR_SECRET")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Selectel configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "$MIRROR_ENDPOINT" == https://* ]] || { echo "Selectel endpoint must use HTTPS" >&2; exit 1; }

      - name: Fetch and validate authoritative catalog
        run: |
          node scripts/server-catalog-snapshot.mjs \
            --url "$CATALOG_SOURCE_URL" \
            --out artifacts/server-catalog/servers.json
          sha256sum artifacts/server-catalog/servers.json

      - name: Install pinned Selectel S3 CA bundle
        shell: bash
        run: |
          set -euo pipefail
          ca_dir="$RUNNER_TEMP/selectel-s3-ca"
          mkdir -p "$ca_dir"

          curl --fail --silent --show-error --location \
            https://secure.globalsign.net/cacert/root-r6.crt \
            --output "$ca_dir/root-r6.der"

          openssl x509 \
            -inform der \
            -in "$ca_dir/root-r6.der" \
            -out "$ca_dir/root-r6.pem"

          actual="$(openssl x509 \
            -in "$ca_dir/root-r6.pem" \
            -noout \
            -fingerprint \
            -sha1 |
            sed 's/^[^=]*=//' |
            tr '[:lower:]' '[:upper:]')"

          expected='80:94:64:0E:B5:A7:A1:CA:11:9C:1F:DD:D5:9F:81:02:63:A7:FB:D1'

          [[ "$actual" == "$expected" ]] || {
            echo "Unexpected GlobalSign Root R6 thumbprint: $actual" >&2
            exit 1
          }

          echo "AWS_CA_BUNDLE=$ca_dir/root-r6.pem" >> "$GITHUB_ENV"
      - name: Verify AWS CLI availability
        run: aws --version

      - name: Upload immutable-validated snapshot to Selectel
        shell: bash
        env:
          MIRROR_ENDPOINT: ${{ vars.LEGENDBORN_VPK_MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ vars.LEGENDBORN_VPK_MIRROR_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.LEGENDBORN_VPK_MIRROR_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LEGENDBORN_VPK_MIRROR_SECRET }}
          AWS_DEFAULT_REGION: ru-3
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          aws s3 cp artifacts/server-catalog/servers.json \
            "s3://${MIRROR_BUCKET}/${SELECTEL_OBJECT_KEY}" \
            --endpoint-url "$MIRROR_ENDPOINT" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300, must-revalidate" \
            --no-progress \
            --only-show-errors

      - name: Verify public Selectel copy byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum artifacts/server-catalog/servers.json | awk '{print $1}')"
          verified=""
          for attempt in 1 2 3 4 5; do
            rm -f artifacts/server-catalog/verified.json
            if node scripts/server-catalog-snapshot.mjs \
              --url "${SELECTEL_PUBLIC_URL}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              --out artifacts/server-catalog/verified.json; then
              actual="$(sha256sum artifacts/server-catalog/verified.json | awk '{print $1}')"
              if [[ "$actual" == "$expected" ]]; then
                verified="yes"
                echo "Selectel public snapshot verified: SHA256=$actual"
                break
              fi
              echo "Attempt $attempt: public SHA256 $actual != expected $expected" >&2
            fi
            sleep $((attempt * 2))
          done
          [[ "$verified" == "yes" ]] || { echo "Selectel public snapshot verification failed" >&2; exit 1; }
