name: Release (Velopack)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE to publish a production launcher release"
        required: true
        default: ""
      force:
        description: "Build and publish even if tag already exists"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: velopack-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CS_PROJ: LegendBorn.csproj
  PACK_ID: LegendBornLauncher
  MAIN_EXE: LegendBorn.exe
  PACK_TITLE: LegendBorn Launcher
  VPK_OUTPUT_DIR: Releases
  VPK_CHANNEL: win
  VPK_MIRROR_PREFIX: launcher/releases
  FORCE_RELEASE: ${{ inputs.force == 'true' }}

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Require explicit production confirmation
        shell: pwsh
        run: |
          if ("${{ inputs.confirm }}" -cne "RELEASE") {
            throw "Production release blocked. Re-run the workflow and type RELEASE in the confirmation field."
          }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET 10 + .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve csproj path
        id: csproj
        shell: pwsh
        run: |
          $candidate = "${{ env.CS_PROJ }}".Trim()
          $resolved = $null

          if (![string]::IsNullOrWhiteSpace($candidate) -and (Test-Path $candidate)) {
            $resolved = (Resolve-Path $candidate).Path
          } else {
            $exact = Get-ChildItem -Recurse -Filter "LegendBorn.csproj" -File | Select-Object -First 1
            if ($exact) {
              $resolved = $exact.FullName
            } else {
              $first = Get-ChildItem -Recurse -Filter "*.csproj" -File | Select-Object -First 1
              if ($first) { $resolved = $first.FullName }
            }
          }

          if (-not $resolved) {
            Write-Host "Found csproj files:"
            Get-ChildItem -Recurse -Filter "*.csproj" -File | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host
            throw "csproj not found. Set env.CS_PROJ to correct path."
          }

          "path=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved csproj: $resolved"

      - name: Read Version and Velopack version from csproj
        id: ver
        shell: pwsh
        run: |
          $proj = "${{ steps.csproj.outputs.path }}"
          if (!(Test-Path $proj)) { throw "csproj not found: $proj" }

          [xml]$xml = Get-Content -Raw -Path $proj
          $pg = $xml.Project.PropertyGroup

          $v = ($pg | Where-Object { $_.Version } | Select-Object -ExpandProperty Version -First 1)
          if (-not $v) {
            $v = ($pg | Where-Object { $_.InformationalVersion } | Select-Object -ExpandProperty InformationalVersion -First 1)
          }
          if (-not $v) {
            $v = ($pg | Where-Object { $_.AssemblyVersion } | Select-Object -ExpandProperty AssemblyVersion -First 1)
          }
          if ([string]::IsNullOrWhiteSpace($v)) {
            throw "Version not found in csproj (Version/InformationalVersion/AssemblyVersion)"
          }

          $v = $v.ToString().Split('+')[0].Trim()

          $velopackRef = $xml.Project.ItemGroup.PackageReference |
            Where-Object { $_.Include -eq "Velopack" } |
            Select-Object -First 1
          $velopackVersion = [string]$velopackRef.Version
          if ([string]::IsNullOrWhiteSpace($velopackVersion)) {
            throw "Velopack PackageReference version not found in csproj"
          }

          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "velopack_version=$velopackVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version=$v"
          Write-Host "Tag=v$v"
          Write-Host "Velopack=$velopackVersion"

      - name: Check if tag already exists
        id: tagcheck
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = "${{ steps.ver.outputs.tag }}"
          $exists = (git tag -l $tag)

          $force = "${{ env.FORCE_RELEASE }}".ToLowerInvariant() -eq "true"
          if ($exists -and -not $force) {
            "exists=true" | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "Tag $tag exists. FORCE_RELEASE=false -> will skip."
          } else {
            "exists=false" | Out-File $env:GITHUB_OUTPUT -Append
            if ($exists -and $force) {
              Write-Host "Tag $tag exists, but FORCE_RELEASE=true -> will continue."
            } else {
              Write-Host "Tag $tag does not exist -> will continue."
            }
          }

      - name: Require Selectel mirror configuration
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        env:
          MIRROR_ENDPOINT: ${{ vars.LEGENDBORN_VPK_MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ vars.LEGENDBORN_VPK_MIRROR_BUCKET }}
          MIRROR_KEY_ID: ${{ secrets.LEGENDBORN_VPK_MIRROR_KEY_ID }}
          MIRROR_SECRET: ${{ secrets.LEGENDBORN_VPK_MIRROR_SECRET }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:MIRROR_ENDPOINT)) { $missing += 'vars.LEGENDBORN_VPK_MIRROR_ENDPOINT' }
          if ([string]::IsNullOrWhiteSpace($env:MIRROR_BUCKET)) { $missing += 'vars.LEGENDBORN_VPK_MIRROR_BUCKET' }
          if ([string]::IsNullOrWhiteSpace($env:MIRROR_KEY_ID)) { $missing += 'secrets.LEGENDBORN_VPK_MIRROR_KEY_ID' }
          if ([string]::IsNullOrWhiteSpace($env:MIRROR_SECRET)) { $missing += 'secrets.LEGENDBORN_VPK_MIRROR_SECRET' }

          if ($missing.Count -gt 0) {
            throw "Production release blocked: configure Selectel Velopack mirror first. Missing: $($missing -join ', ')"
          }

          if (-not $env:MIRROR_ENDPOINT.StartsWith('https://', [StringComparison]::OrdinalIgnoreCase)) {
            throw "LEGENDBORN_VPK_MIRROR_ENDPOINT must be an HTTPS S3-compatible endpoint."
          }

      - name: Restore win-x64
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet restore "${{ steps.csproj.outputs.path }}" -r win-x64

      - name: Build (warnings are errors)
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet build "${{ steps.csproj.outputs.path }}" -c Release --no-restore -warnaserror

      - name: Publish app
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet publish "${{ steps.csproj.outputs.path }}" -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Install vpk tool
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version "${{ steps.ver.outputs.velopack_version }}"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          vpk --help

      - name: Download previous releases (optional)
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir "${{ env.VPK_OUTPUT_DIR }}" `
            --channel "${{ env.VPK_CHANNEL }}"

      - name: Create Velopack packages
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        run: |
          vpk pack `
            --packId "${{ env.PACK_ID }}" `
            --packVersion "${{ steps.ver.outputs.version }}" `
            --packDir "publish" `
            --mainExe "${{ env.MAIN_EXE }}" `
            --packTitle "${{ env.PACK_TITLE }}" `
            --outputDir "${{ env.VPK_OUTPUT_DIR }}" `
            --channel "${{ env.VPK_CHANNEL }}" `
            --runtime "win-x64"

      - name: Upload Selectel Velopack mirror
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        env:
          MIRROR_ENDPOINT: ${{ vars.LEGENDBORN_VPK_MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ vars.LEGENDBORN_VPK_MIRROR_BUCKET }}
          MIRROR_KEY_ID: ${{ secrets.LEGENDBORN_VPK_MIRROR_KEY_ID }}
          MIRROR_SECRET: ${{ secrets.LEGENDBORN_VPK_MIRROR_SECRET }}
        run: |
          vpk upload s3 `
            --endpoint "$env:MIRROR_ENDPOINT" `
            --bucket "$env:MIRROR_BUCKET" `
            --keyId "$env:MIRROR_KEY_ID" `
            --secret "$env:MIRROR_SECRET" `
            --prefix "${{ env.VPK_MIRROR_PREFIX }}" `
            --outputDir "${{ env.VPK_OUTPUT_DIR }}" `
            --channel "${{ env.VPK_CHANNEL }}"

      - name: Upload GitHub Release
        if: steps.tagcheck.outputs.exists != 'true'
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir "${{ env.VPK_OUTPUT_DIR }}" `
            --channel "${{ env.VPK_CHANNEL }}" `
            --publish `
            --releaseName "${{ env.PACK_TITLE }} ${{ steps.ver.outputs.version }}" `
            --tag "${{ steps.ver.outputs.tag }}" `
            --targetCommitish "${{ github.sha }}"
