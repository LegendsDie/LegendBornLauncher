name: PR2 Selectel catalog bootstrap with CA

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/catalog-bootstrap-ca-pr2.yml"

permissions:
  contents: read

jobs:
  bootstrap-selectel:
    if: github.repository == 'LegendsDie/LegendBornLauncher' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/production-hardening' && github.actor == 'LegendsDie'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR2
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Validate snapshot code
        run: |
          node --test tests/server-catalog-snapshot.test.mjs
          node --check scripts/server-catalog-snapshot.mjs

      - name: Render fresh production snapshot
        run: node scripts/server-catalog-snapshot.mjs --url https://legendborn.xyz/api/launcher/servers --out artifacts/server-catalog/servers.json

      - name: Require Selectel configuration
        shell: bash
        env:
          MIRROR_ENDPOINT: ${{ vars.LEGENDBORN_VPK_MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ vars.LEGENDBORN_VPK_MIRROR_BUCKET }}
          MIRROR_KEY_ID: ${{ secrets.LEGENDBORN_VPK_MIRROR_KEY_ID }}
          MIRROR_SECRET: ${{ secrets.LEGENDBORN_VPK_MIRROR_SECRET }}
        run: |
          set -euo pipefail
          [[ "$MIRROR_ENDPOINT" == https://* ]]
          [[ -n "$MIRROR_BUCKET" ]]
          [[ -n "$MIRROR_KEY_ID" ]]
          [[ -n "$MIRROR_SECRET" ]]

      - name: Install pinned Selectel S3 CA bundle
        shell: bash
        run: |
          set -euo pipefail
          ca_dir="$RUNNER_TEMP/selectel-s3-ca"
          mkdir -p "$ca_dir"
          curl --fail --silent --show-error --location \
            https://secure.globalsign.net/cacert/root-r6.crt \
            --output "$ca_dir/root-r6.der"
          openssl x509 -inform der -in "$ca_dir/root-r6.der" -out "$ca_dir/root-r6.pem"
          actual="$(openssl x509 -in "$ca_dir/root-r6.pem" -noout -fingerprint -sha1 | sed 's/^[^=]*=//' | tr '[:lower:]' '[:upper:]')"
          expected='80:94:64:0E:B5:A7:A1:CA:11:9C:1F:DD:D5:9F:81:02:63:A7:FB:D1'
          [[ "$actual" == "$expected" ]] || { echo "Unexpected GlobalSign Root R6 thumbprint: $actual" >&2; exit 1; }
          echo "AWS_CA_BUNDLE=$ca_dir/root-r6.pem" >> "$GITHUB_ENV"
          openssl x509 -in "$ca_dir/root-r6.pem" -noout -subject -issuer -dates

      - name: Upload launcher/servers.json
        shell: bash
        env:
          MIRROR_ENDPOINT: ${{ vars.LEGENDBORN_VPK_MIRROR_ENDPOINT }}
          MIRROR_BUCKET: ${{ vars.LEGENDBORN_VPK_MIRROR_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.LEGENDBORN_VPK_MIRROR_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LEGENDBORN_VPK_MIRROR_SECRET }}
          AWS_DEFAULT_REGION: ru-3
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          aws --version
          aws s3 cp artifacts/server-catalog/servers.json \
            "s3://${MIRROR_BUCKET}/launcher/servers.json" \
            --endpoint-url "$MIRROR_ENDPOINT" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300, must-revalidate" \
            --no-progress \
            --only-show-errors

      - name: Verify public object byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum artifacts/server-catalog/servers.json | awk '{print $1}')"
          for attempt in 1 2 3 4 5; do
            rm -f artifacts/server-catalog/public.json
            if node scripts/server-catalog-snapshot.mjs \
              --url "https://612cd759-4c9d-450e-bc91-a51d3c56e834.selstorage.ru/launcher/servers.json?bootstrap=${GITHUB_RUN_ID}-${attempt}" \
              --out artifacts/server-catalog/public.json; then
              actual="$(sha256sum artifacts/server-catalog/public.json | awk '{print $1}')"
              if [[ "$actual" == "$expected" ]]; then
                echo "BOOTSTRAP VERIFIED SHA256=$actual"
                exit 0
              fi
              echo "Attempt $attempt: public SHA256 $actual != expected $expected" >&2
            fi
            sleep $((attempt * 2))
          done
          echo "Public Selectel object did not match uploaded snapshot" >&2
          exit 1
