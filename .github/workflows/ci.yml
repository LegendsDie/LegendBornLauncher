name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, publish and package (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read project metadata
        id: meta
        shell: pwsh
        run: |
          [xml]$xml = Get-Content -Raw -Path "LegendBorn.csproj"

          $versionNode = $xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $version = [string]$versionNode.Version

          $velopackRef = $xml.Project.ItemGroup.PackageReference |
            Where-Object { $_.Include -eq "Velopack" } |
            Select-Object -First 1
          $velopackVersion = [string]$velopackRef.Version

          if ([string]::IsNullOrWhiteSpace($version)) { throw "Project Version not found" }
          if ([string]::IsNullOrWhiteSpace($velopackVersion)) { throw "Velopack PackageReference not found" }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "velopack_version=$velopackVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify seed-only pack policy
        shell: pwsh
        run: |
          $source = Get-Content -Raw -Path "Launching/MinecraftService.cs"
          $match = [regex]::Match(
            $source,
            'AlwaysProtectedMutablePrefixes\s*=\s*\{(?<body>.*?)\};',
            [System.Text.RegularExpressions.RegexOptions]::Singleline)

          if (-not $match.Success) {
            throw "AlwaysProtectedMutablePrefixes policy was not found."
          }

          $body = $match.Groups['body'].Value
          foreach ($required in @('config/', 'defaultconfigs/', 'resourcepacks/', 'shaderpacks/')) {
            if (-not $body.Contains('"' + $required + '"')) {
              throw "Protected pack prefix is missing: $required"
            }
          }

          if ($source -notmatch 'if \(IsAlwaysProtectedMutable\(rel\)\) continue;') {
            throw "Manifest delete path no longer protects AlwaysProtectedMutable prefixes."
          }

          if ($source -notmatch '!IsAlwaysProtectedMutable\(r\)') {
            throw "Prune path no longer excludes AlwaysProtectedMutable prefixes."
          }

      - name: Verify launcher auth contract policy
        shell: pwsh
        run: |
          $authClient = Get-Content -Raw -Path "Services/LauncherAuthClient.cs"
          $authVm = Get-Content -Raw -Path "ViewModels/MainViewModel.Auth.cs"

          if ($authClient -notmatch 'ProductionOrigin\s*=\s*"https://legendborn\.xyz/"') {
            throw "Launcher auth origin drifted from legendbornweb production origin."
          }

          foreach ($required in @(
            'api/launcher/login',
            'api/launcher/logout',
            'PollState.TerminalError',
            'PollState.TransientError',
            'HttpStatusCode.TooManyRequests',
            'AllowAutoRedirect = false'
          )) {
            if (-not $authClient.Contains($required)) {
              throw "Launcher auth policy token missing: $required"
            }
          }

          if ($authVm -notmatch 'RevokeAsync\(') {
            throw "Launcher logout no longer revokes the server-side token."
          }

          # SiteAuthService still contains legacy helper definitions for compatibility with
          # the old monolith, but no production code may call those phantom web routes.
          $deprecated = Get-ChildItem -Recurse -File -Filter '*.cs' |
            Where-Object { $_.FullName -notlike '*\Services\SiteAuthService.cs' } |
            Select-String -Pattern 'SendLauncherEventAsync\s*\(|GetRezoniteBalanceAsync\s*\('

          if ($deprecated) {
            $details = ($deprecated | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }) -join "`n"
            throw "Deprecated phantom launcher API helper is referenced outside SiteAuthService:`n$details"
          }

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore win-x64
        run: dotnet restore LegendBorn.csproj -r win-x64

      - name: Build (warnings are errors)
        run: dotnet build LegendBorn.csproj -c Release --no-restore -warnaserror

      - name: Publish self-contained launcher
        run: dotnet publish LegendBorn.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version "${{ steps.meta.outputs.velopack_version }}"

      - name: Velopack package smoke test
        shell: pwsh
        run: |
          & "$env:USERPROFILE\.dotnet\tools\vpk.exe" pack `
            --packId "LegendBornLauncher" `
            --packVersion "${{ steps.meta.outputs.version }}" `
            --packDir "artifacts/publish" `
            --mainExe "LegendBorn.exe" `
            --packTitle "LegendBorn Launcher" `
            --outputDir "artifacts/releases" `
            --channel "win" `
            --runtime "win-x64"
