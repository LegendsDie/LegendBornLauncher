name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, publish and package (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore win-x64
        run: dotnet restore LegendBorn.csproj -r win-x64

      - name: Build
        run: dotnet build LegendBorn.csproj -c Release --no-restore

      - name: Publish self-contained launcher
        run: dotnet publish LegendBorn.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Velopack package smoke test
        shell: pwsh
        run: |
          & "$env:USERPROFILE\.dotnet\tools\vpk.exe" pack `
            --packId "LegendBornLauncher" `
            --packVersion "0.3.8" `
            --packDir "artifacts/publish" `
            --mainExe "LegendBorn.exe" `
            --packTitle "LegendBorn Launcher" `
            --outputDir "artifacts/releases" `
            --channel "win" `
            --runtime "win-x64"
