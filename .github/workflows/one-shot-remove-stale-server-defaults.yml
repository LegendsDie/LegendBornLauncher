name: One-shot remove stale server defaults

on:
  push:
    branches: ["agent/production-hardening"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry stale endpoint cleanup safely'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/production-hardening
          fetch-depth: 0

      - name: Remove mutable endpoint literals and prefer Selectel pack bootstrap
        shell: python
        run: |
          from pathlib import Path

          stale_host = "legendcraft.minerent.io"

          vm = Path("ViewModels/MainViewModel.cs")
          text = vm.read_text(encoding="utf-8")
          old = f'    private const string DefaultServerIp = "{stale_host}";'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale DefaultServerIp, got {text.count(old)}")
          text = text.replace(old, '    private const string DefaultServerIp = "";')
          text = text.replace(
              '        public string PackBaseUrl { get; init; } = "https://legendborn.ru/launcher/pack/";',
              '        public string PackBaseUrl { get; init; } = "";')
          vm.write_text(text, encoding="utf-8")

          legacy = Path("Services/ServerListService.cs")
          lt = legacy.read_text(encoding="utf-8")
          lt = lt.replace(f'Address = "{stale_host}",', 'Address = "",')
          legacy.write_text(lt, encoding="utf-8")

          for path in (vm, legacy):
              if stale_host in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"stale server host remains in {path}")

          mc = Path("Launching/MinecraftService.cs")
          lines = mc.read_text(encoding="utf-8").splitlines()
          pack_line = '        "https://pack.legendborn.ru/launcher/pack/",'
          selectel_line = '        "https://612cd759-4c9d-450e-bc91-a51d3c56e834.selstorage.ru/launcher/pack/",'
          if pack_line not in lines or selectel_line not in lines:
              raise SystemExit("expected default pack mirror lines were not found")
          i = lines.index(pack_line)
          j = lines.index(selectel_line)
          if i < j:
              lines[i], lines[j] = lines[j], lines[i]
          mc.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-remove-stale-server-defaults.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ViewModels/MainViewModel.cs Services/ServerListService.cs Launching/MinecraftService.cs .github/workflows/one-shot-remove-stale-server-defaults.yml
          git diff --cached --check
          git commit -m "Remove stale compiled server endpoint and prefer Selectel"
          git push origin HEAD:agent/production-hardening
