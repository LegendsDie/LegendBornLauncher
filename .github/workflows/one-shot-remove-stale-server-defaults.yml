name: One-shot remove stale server defaults

on:
  push:
    branches: ["agent/production-hardening"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Remove stale compiled server defaults safely'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/production-hardening
          fetch-depth: 0

      - name: Remove mutable endpoint literals and prefer Selectel pack bootstrap
        shell: python
        run: |
          from pathlib import Path

          vm = Path("ViewModels/MainViewModel.cs")
          text = vm.read_text(encoding="utf-8")
          old = '    private const string DefaultServerIp = "legendcraft.minerent.io";'
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale DefaultServerIp, got {text.count(old)}")
          text = text.replace(old, '    private const string DefaultServerIp = "";')
          old_pack = '        public string PackBaseUrl { get; init; } = "https://legendborn.ru/launcher/pack/";'
          if old_pack in text:
              text = text.replace(old_pack, '        public string PackBaseUrl { get; init; } = "";')
          vm.write_text(text, encoding="utf-8")

          legacy = Path("Services/ServerListService.cs")
          lt = legacy.read_text(encoding="utf-8")
          lt = lt.replace('Address = "legendcraft.minerent.io",', 'Address = "",')
          legacy.write_text(lt, encoding="utf-8")

          mc = Path("Launching/MinecraftService.cs")
          mt = mc.read_text(encoding="utf-8")
          old_order = '''        "https://pack.legendborn.ru/launcher/pack/",
          "https://612cd759-4c9d-450e-bc91-a51d3c56e834.selstorage.ru/launcher/pack/",'''
          new_order = '''        "https://612cd759-4c9d-450e-bc91-a51d3c56e834.selstorage.ru/launcher/pack/",
          "https://pack.legendborn.ru/launcher/pack/",'''
          if mt.count(old_order) != 1:
              raise SystemExit(f"expected one old pack mirror order, got {mt.count(old_order)}")
          mt = mt.replace(old_order, new_order)
          mc.write_text(mt, encoding="utf-8")

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-remove-stale-server-defaults.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ViewModels/MainViewModel.cs Services/ServerListService.cs Launching/MinecraftService.cs .github/workflows/one-shot-remove-stale-server-defaults.yml
          git diff --cached --check
          git commit -m "Remove stale compiled server endpoint and prefer Selectel"
          git push origin HEAD:agent/production-hardening
